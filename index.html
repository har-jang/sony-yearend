/* Layout: built from the Figma frame "SOK 송년회 초대장 (390)" — cover image, scroll hint, one shadowed card holding info rows, calendar box and the attendee list */
:root{
  --page:#ffffff;
  --card:#fbfcff;
  --row:#f8f8f8;
  --ink:#151b33;
  --sub:#5f6784;
  --label:#7e7e7e;
  --hint:#6d7488;
  --dark:#232323;
  --line:#e2e3e4;
  --count:#4a4a46;
  --font:"Apple SD Gothic Neo","AppleSDGothicNeo","Pretendard",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.page{max-width:390px;margin:0 auto;padding-bottom:56px;display:flex;flex-direction:column;align-items:center}
.cover{width:100%;max-width:100%}
.wrap{width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
.cover img{display:block;width:100%;height:auto}
.hint{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:18px;font-size:12.5px;font-weight:500;color:var(--hint);letter-spacing:.04em;line-height:1.4}
.hint svg{width:18px;height:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}
.card{width:100%;background:var(--card);border-radius:20px;box-shadow:0 12px 32px rgba(40,48,70,.12);padding:22px 18px 26px;display:flex;flex-direction:column;gap:22px}
.info{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;padding:16px 18px;border-radius:14px;background:var(--row)}
.row .lbl{flex:0 0 38px;font-size:14px;font-weight:800;color:var(--label);letter-spacing:.06em;line-height:1.4}
.row .val{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row .t{font-size:15.5px;font-weight:800;line-height:1.4}
.row .s{font-size:13px;color:var(--sub);line-height:1.55}
.map{align-self:flex-start;margin-top:2px;display:inline-flex;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #eceee1;color:#000;font-size:13px;font-weight:800;text-decoration:none;line-height:1.4}
.map:hover{background:#f6f7f1}
.cal{background:var(--dark);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.cal h2{margin:0;font-size:17px;font-weight:700;color:#f3f5fb;line-height:1.4}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:inherit;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;height:48px;padding:10px 12px;border-radius:999px;background:#fbfcff;color:#0d1430;font-size:14.5px;font-weight:700;text-decoration:none;line-height:1.4;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.map:focus-visible{outline:2px solid #8fa4e8;outline-offset:2px}
.note{margin:0;text-align:center;font-size:9.5px;line-height:1.6;color:#e9ecdf}
.ppl{border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:center}
.head h3{margin:0;font-size:17px;font-weight:800;line-height:1.4}
.head h3.b{font-weight:700}
.head span{font-size:13px;font-weight:800;color:var(--count);font-variant-numeric:tabular-nums}
.names{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names li{display:flex;align-items:center;justify-content:center;gap:4px;height:36px;border-radius:999px;background:var(--row);font-size:14px;font-weight:700;white-space:nowrap}
.names li small{font-size:12px;font-weight:400;color:var(--sub)}
.dash{border:0;border-top:1px dashed #e3e7f2;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#232323;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
